# Copy to config/config.toml (gitignored) and edit.

[paths]
data_dir = "data"
field_profile = "config/field_profile.md"

[profile]
# Who the digest and podcast are for. Change this and config/field_profile.md for your field.
reader = "a computational materials science PhD student working on machine-learning interatomic potentials, DFT, and molecular dynamics"

# Names, handles or words that must never be published; the publish scans check them.
private_markers = []

[browser]
# Playwright MCP server, pinned. Uses its own persistent profile; log in once with `radar login`.
mcp_command = "npx"
mcp_args = ["-y", "@playwright/mcp@0.0.84", "--browser", "chromium"]
headless = false
feed_url = "https://www.linkedin.com/feed/"

[scan]
# Human-paced, low-volume defaults. Keep them conservative.
max_posts = 60
max_minutes = 10
scroll_px_min = 600
scroll_px_max = 1100
pause_s_min = 2.5
pause_s_max = 6.0
stale_steps_stop = 6

[llm]
host = "http://localhost:11434"
model = "mimo-v2.6"
num_ctx = 16384
timeout_s = 120
think = false             # true: model reasons first; ~3x slower, mixed accuracy in tests

[digest]
# The local model pre-screens; Codex reviews every candidate and keeps min..max items.
min_items = 5
max_items = 15
max_candidates = 80       # cap on candidates sent to Codex per run
backlog_days = 3          # undigested saved posts older than this are dropped
codex_command = "codex"
codex_model = ""          # empty = Codex default
web_search = true

[notebooklm]
# Podcast = NotebookLM Audio Overview, generated in the agent's own browser profile.
# Sign in once with `radar notebooklm-login`.
enabled = true
length = "default"        # shorter | default | longer
timeout_min = 30
add_web_sources = true

[email]
# Daily email with the digest, queue, script, and podcast MP3. Put your real address only in
# config/config.toml (gitignored). The Gmail App Password goes in the OS credential store via
# `radar email-setup`, never in this file.
enabled = false
to = "you@example.com"
sender = ""               # Gmail account that sends; empty = same as `to`
smtp_host = "smtp.gmail.com"
smtp_port = 587
subject_prefix = "Research Radar"

[builds]
# Daily learning build: an AI-built demo of one digest item, made by a GitHub Actions workflow in
# your own public repo (set it up once with `radar build --init-repo`). Off until you set `repo`
# and store an Anthropic API key (`radar builds-key`, kept only as a secret in that repo).
# Only the item's public fields and config/field_profile.md are sent to the workflow.
enabled = false
mode = "with_digest"      # with_digest | separate
separate_time = "08:30"   # used when mode = "separate"
repo = ""                 # owner/name of the GitHub repo that receives the builds
git_name = ""             # commit author: your GitHub noreply identity
git_email = ""            # must be your GitHub noreply address (...@users.noreply.github.com)
# Build records and logs. Empty = %LOCALAPPDATA%\ResearchRadar\builds on Windows,
# ~/.local/share/research-radar/builds elsewhere. Keep it out of synced folders.
work_dir = ""
poll_min = 90             # minutes the daily run waits for the workflow (5-240)

[podcasts]
# Publish each day's podcast episode as a GitHub Release in a public repo (set it up once with
# `radar podcast --init-repo`). Only the episode, a title and the kept items' titles and links are
# published. Off until you set `repo`.
enabled = false
repo = ""                 # owner/name of the public GitHub repo that receives the episodes
