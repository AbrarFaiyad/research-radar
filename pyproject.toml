[project]
name = "research-radar"
version = "0.1.0"
description = "Local agent that reads the LinkedIn feed, keeps AI-for-materials research, queues authors to connect with, and turns the day's papers into a Codex-researched podcast."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.12",
    "httpx>=0.27",
    "keyring>=25",
    "lameenc>=1.7",
    "markdown>=3.5",
    "av>=14",
    "fastapi>=0.110",
    "tomlkit>=0.12",
    "uvicorn>=0.29",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.6", "numpy>=1.26"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "C4", "PYI", "S110"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body"]
