[project]
name = "research-radar"
version = "0.1.0"
description = "Local agent that reads the LinkedIn feed, keeps AI-for-materials research, queues authors to connect with, and turns the day's papers into a Codex-researched podcast."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.hatch.build.targets.wheel.force-include]
"src/radar/browser/extract_feed.js" = "radar/browser/extract_feed.js"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
