name: Daily build
run-name: build ${{ inputs.folder }}

on:
  workflow_dispatch:
    inputs:
      folder:
        description: Folder name, YYYY-MM-DD_package_task
        type: string
        required: true
      prompt:
        description: Build prompt
        type: string
        required: true

# Action versions are pinned to commit SHAs. Verify and bump them from time to time.
permissions: {}

concurrency:
  group: daily-builds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.329
      - name: Validate folder name
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          if ! printf '%s' "$FOLDER" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}_[a-z0-9-]+_[a-z0-9-]+$'; then
            echo "folder name is not YYYY-MM-DD_package_task" >&2
            exit 1
          fi
      - name: Write prompt
        env:
          PROMPT: ${{ inputs.prompt }}
        run: printf '%s' "$PROMPT" > prompt.txt
      - name: Build with Claude
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir work
          cd work
          claude -p --model sonnet --max-turns 60 --permission-mode bypassPermissions < ../prompt.txt
      - name: Run the notebook
        run: |
          mkdir -p work
          cd work
          ran=false
          if [ -f requirements.txt ] && [ -f demo.ipynb ]; then
            if pip install papermill ipykernel && pip install -r requirements.txt \
              && papermill demo.ipynb demo.ipynb --cwd . --execution-timeout 600; then
              ran=true
            fi
          fi
          printf '{"ran": %s}\n' "$ran" > .status.json
      - name: Remove caches
        if: always()
        run: |
          mkdir -p work
          find work \( -name __pycache__ -o -name .ipynb_checkpoints -o -name .venv -o -name .git \) \
            -prune -exec rm -rf {} +
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: build
          path: work
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: artifact
      - name: Scan and commit
        env:
          FOLDER: ${{ inputs.folder }}
        run: python tools/publish_build.py --folder "$FOLDER" --src artifact
      - name: Push
        run: git push
